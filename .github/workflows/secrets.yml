name: secrets

# 鍵やトークンなどの秘密がcommitに混ざっていないかを、gitleaksで履歴ごと調べる。
# 公開リポジトリなので、pushした時点で誰でも見られる。commitの前にもlefthookで調べる（scripts/check-secrets.sh）
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # 履歴をすべて取る。PRの途中のcommitで入れて、後のcommitで消した秘密も見つける
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaksのGitHub Actionは、orgのリポジトリだとライセンスキーが要る。作者のDockerイメージを直接使う。
      # 版はscripts/check-secrets.shと合わせる。コンテナのユーザーをファイルの持ち主にそろえ、gitに拒まれないようにする
      - run: >-
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose --no-banner
