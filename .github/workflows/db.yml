name: db

# migrationとseedが空のDBに最後まで通るか、DBの関数に型の誤りなどが無いか、
# commitしたDBの型がmigrationと合っているかを確かめる。
# Supabaseを起動するので時間がかかる。DBに関係するファイルを変えたときだけ動かす
on:
  pull_request:
    paths:
      - "supabase/**"
      - "apps/api/src/lib/database.types.ts"
      - ".github/workflows/db.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "apps/api/src/lib/database.types.ts"
      - ".github/workflows/db.yml"

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # 版で型の書き方が変わるので、apps/apiのdb:typesと同じ版に固定する。上げるときは両方を変えて型を作り直す
          version: 2.90.0
      # DBだけを起動し、migrationとseed.sqlを順に流す。途中で失敗したら止まる
      - run: supabase db start
      # DBの関数（plpgsql）の型の誤りや、使っていない変数などを見る。警告では落とさない
      - run: supabase db lint --fail-on error
      # migrationを変えたのに、型を作り直し忘れていないか
      - name: DBの型がmigrationと合っているか
        run: |
          supabase gen types typescript --local > apps/api/src/lib/database.types.ts
          if ! git diff --exit-code -- apps/api/src/lib/database.types.ts; then
            echo "::error title=DBの型が古い::migrationから作った型と違う。pnpm --filter @pitari/api db:types で作り直してcommitする"
            exit 1
          fi
