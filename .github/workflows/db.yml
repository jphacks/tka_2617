name: db

# migrationとseedが空のDBに最後まで通るか、DBの関数に型の誤りなどが無いかを確かめる。
# Supabaseを起動するので時間がかかる。DBに関係するファイルを変えたときだけ動かす
on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # 手元で確かめた版に固定する。上げるときは、手元のCLIでも試してから
          version: 2.90.0
      # DBだけを起動し、migrationとseed.sqlを順に流す。途中で失敗したら止まる
      - run: supabase db start
      # DBの関数（plpgsql）の型の誤りや、使っていない変数などを見る。警告では落とさない
      - run: supabase db lint --fail-on error
