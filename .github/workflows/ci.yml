name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 検査をjobに分けて、並列に流す。PRでどれが落ちたかがすぐ分かり、落ちたjobだけを流し直せる
jobs:
  # 整形・lint（ESLintとtextlint）・使っていないコード・型
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      # 使っていないファイル・export・依存（knip.jsonc）
      - run: pnpm knip
      - run: pnpm typecheck

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # バージョンはruff.tomlのrequired-versionと合わせる
      - run: pipx run ruff==0.17.1 format --check .
      - run: pipx run ruff==0.17.1 check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # server-only の違反（クライアントからサーバー専用のコードを読み込む）は build でしか分からないため
      - run: pnpm build

  # mainに入ったコードを、ほかのjobがすべて通ってから本番に出す（docs/adr/0004-deploy-web-with-vercel-cli.md）
  deploy:
    needs: [static, python, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 続けてマージしたとき、古いほうが後から本番を上書きしないよう、1つずつ順に出す
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npx --yes vercel@59.23.2 deploy --prod --yes
        # 鍵はこのstepだけに渡す。--tokenでも渡さない。コマンドの引数はプロセスの一覧やログに出ることがあるため
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
